<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vein Launcher</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    background:radial-gradient(ellipse at top,#1e293b 0%,#0f172a 55%,#020617 100%);
    color:#e2e8f0;padding:2rem;
  }
  .wrap{text-align:center;max-width:640px;width:100%}
  .logo{
    width:88px;height:88px;margin:0 auto 1.8rem;border-radius:22px;
    background:linear-gradient(135deg,#38bdf8,#6366f1);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 12px 40px rgba(56,189,248,.3);
  }
  .logo svg{width:48px;height:48px;fill:#fff}
  h1{
    font-size:2.4rem;font-weight:700;letter-spacing:-.02em;
    background:linear-gradient(135deg,#f8fafc,#94a3b8);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    margin-bottom:.8rem;
  }
  .sub{color:#94a3b8;font-size:1.05rem;line-height:1.7;margin-bottom:2.2rem}
  .status{
    display:inline-flex;align-items:center;gap:.55rem;
    padding:.55rem 1.1rem;border-radius:999px;
    background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);
    color:#4ade80;font-size:.9rem;font-weight:500;
  }
  .dot{
    width:7px;height:7px;border-radius:50%;background:#4ade80;
    box-shadow:0 0 0 0 rgba(74,222,128,.7);
    animation:pulse 2s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(74,222,128,.6)}
    70%{box-shadow:0 0 0 9px rgba(74,222,128,0)}
    100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}
  }
  .domains{
    margin-top:2.4rem;padding-top:1.6rem;
    border-top:1px solid rgba(148,163,184,.15);
    display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;
  }
  .domains code{
    padding:.35rem .8rem;border-radius:7px;
    background:rgba(148,163,184,.09);
    border:1px solid rgba(148,163,184,.15);
    color:#7dd3fc;font-size:.82rem;font-family:ui-monospace,monospace;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <svg viewBox="0 0 24 24"><path d="M8.5 4.5l7 7.5-7 7.5" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <h1>Vein Launcher</h1>
  <p class="sub">站点已就绪，等待部署</p>
  <div class="status"><span class="dot"></span>Service Online</div>
  <div class="domains">
    <code>vl.zhanjhn.cn</code>
    <code>veinlauncher.zhanjhn.cn</code>
    <code>vl.lhsy.online</code>
    <code>veinlauncher.lhsy.online</code>
  </div>
</div>
</body>
</html>
