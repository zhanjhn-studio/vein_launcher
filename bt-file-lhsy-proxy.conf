server
{
    listen 81;
    server_name file.lhsy.online;

    # 访问日志
    access_log  /www/wwwlogs/file.lhsy.online.log;
    error_log  /www/wwwlogs/file.lhsy.online.error.log;

    # Cloudreve 上传大文件需要放宽限制
    client_max_body_size 2048m;

    # 反代到 Cloudreve
    location / {
        proxy_pass http://127.0.0.1:5212;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket 支持（Cloudreve 部分功能需要）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 大文件下载/上传超时
        proxy_connect_timeout 300s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        # 关闭缓冲，避免大文件占内存
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # 禁止访问敏感文件
    location ~* (\.user.ini|\.htaccess|\.htpasswd|\.env|\.git|\.svn|\.log|\.sql)$
    {
        return 404;
    }
}
